<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phishing Detector</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 0 auto; padding: 0 16px; color: #1f2328; }
    header { display: flex; align-items: baseline; gap: 24px; border-bottom: 1px solid #d0d7de; }
    header h1 { font-size: 1.3rem; margin: 16px 0; }
    header a { color: inherit; }
    nav a { margin-right: 16px; }
    textarea { width: 100%; font-family: monospace; box-sizing: border-box; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    button { margin-top: 16px; padding: 8px 20px; font-size: 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #d0d7de; vertical-align: top; }
    td { overflow-wrap: anywhere; }
    .error { color: #cf222e; }
    .verdict { padding: 12px 16px; border-radius: 6px; font-size: 1.2rem; font-weight: 700; }
    .badge { padding: 2px 8px; border-radius: 10px; font-size: .85rem; white-space: nowrap; }
    .phishing { background: #ffebe9; color: #a40e26; }
    .suspicious { background: #fff8c5; color: #7d4e00; }
    .safe { background: #dafbe1; color: #116329; }
    .muted, footer { color: #656d76; font-size: .85rem; }
    footer { margin: 32px 0 16px; border-top: 1px solid #d0d7de; padding-top: 8px; }
  </style>
</head>
<body>
  <header>
    <h1><a href="{{ url_for('index') }}">Phishing Detector</a></h1>
    <nav><a href="{{ url_for('index') }}">Scan</a><a href="{{ url_for('history') }}">History</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>Served by {{ instance_id }}{% if availability_zone %} ({{ availability_zone }}){% endif %}</footer>
</body>
</html>
