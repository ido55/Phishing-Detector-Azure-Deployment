<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="880" viewBox="0 0 1320 880"
     font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1B1B1B">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1B1B1B"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7785"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B7D23"/>
    </marker>
  </defs>

  <rect width="1320" height="880" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="700">Phishing Detector on Azure</text>
  <text x="40" y="64" font-size="13" fill="#555">Terraform (azurerm 5.0) · resource group phishing-detector-rg · two availability zones · Application Gateway → 2 × VM → PostgreSQL Flexible Server</text>

  <!-- Users -->
  <rect x="415" y="82" width="150" height="40" rx="6" fill="#F4F4F4" stroke="#555"/>
  <text x="490" y="107" text-anchor="middle" font-size="13" font-weight="600">Users (browser)</text>

  <!-- Azure region / resource group -->
  <rect x="20" y="135" width="1280" height="700" rx="4" fill="none" stroke="#243A5E" stroke-width="1.5"/>
  <text x="32" y="154" font-size="13" font-weight="700">Azure · Poland Central</text>

  <!-- Virtual network -->
  <rect x="40" y="210" width="860" height="600" fill="none" stroke="#0078D4" stroke-width="1.5"/>
  <text x="888" y="229" text-anchor="end" font-size="13" font-weight="700" fill="#0063B1">Virtual network phishing-detector-vnet · 10.0.0.0/16</text>

  <!-- Subnets: in Azure a subnet spans all zones of the region -->
  <rect x="72" y="238" width="796" height="104" fill="#F2F7FC" stroke="#6CA6DA"/>
  <text x="856" y="334" text-anchor="end" fill="#2B5D8C">subnet-gateway · 10.0.1.0/24</text>

  <rect x="72" y="382" width="796" height="196" fill="#F2F7FC" stroke="#6CA6DA"/>
  <text x="806" y="552" text-anchor="end" fill="#2B5D8C">subnet-app · 10.0.2.0/24</text>
  <text x="806" y="569" text-anchor="end" fill="#2B5D8C">NSG app-nsg: TCP 8000 from subnet-gateway only</text>

  <rect x="72" y="594" width="796" height="196" fill="#F2F7FC" stroke="#6CA6DA"/>
  <text x="560" y="640" font-weight="600" fill="#2B5D8C">subnet-db · 10.0.3.0/24</text>
  <text x="560" y="658" fill="#2B5D8C">delegated to PostgreSQL flexible servers</text>
  <text x="560" y="676" fill="#2B5D8C">NSG db-nsg: TCP 5432 from subnet-app only</text>

  <!-- Availability zones -->
  <rect x="58" y="354" width="402" height="448" rx="4" fill="none" stroke="#7D8998" stroke-dasharray="6 4"/>
  <text x="448" y="798" text-anchor="end" fill="#555">Availability Zone 1</text>
  <rect x="480" y="354" width="402" height="448" rx="4" fill="none" stroke="#7D8998" stroke-dasharray="6 4"/>
  <text x="492" y="798" fill="#555">Availability Zone 2</text>

  <!-- Public IP -->
  <rect x="230" y="150" width="520" height="46" rx="4" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="490" y="169" text-anchor="middle" font-weight="600">Public IP AG-pip · Standard, static, zones 1–3</text>
  <text x="490" y="187" text-anchor="middle" fill="#555">phishing-detector-&lt;suffix&gt;.polandcentral.cloudapp.azure.com</text>

  <!-- Application Gateway -->
  <rect x="190" y="250" width="600" height="70" rx="6" fill="#E7F6F4" stroke="#00897B" stroke-width="1.5"/>
  <text x="490" y="272" text-anchor="middle" font-size="14" font-weight="700">Application Gateway AG (Standard_v2, capacity 1)</text>
  <text x="490" y="291" text-anchor="middle">HTTP :80 → backend pool :8000 · health probe GET /health every 15 s</text>
  <text x="490" y="309" text-anchor="middle" fill="#555">zones 1–3 · backend pool = the NICs of both VMs</text>

  <!-- VMs -->
  <rect x="100" y="396" width="320" height="134" rx="6" fill="#E6F0FB" stroke="#0078D4" stroke-width="1.5"/>
  <text x="260" y="418" text-anchor="middle" font-size="14" font-weight="700">VM phishing-detector-server-01</text>
  <text x="260" y="438" text-anchor="middle">Standard_B1s · Ubuntu 24.04 LTS · 10.0.2.4</text>
  <text x="260" y="456" text-anchor="middle">systemd service: gunicorn + Flask app :8000</text>
  <text x="260" y="474" text-anchor="middle">cloud-init installs the app at first boot</text>
  <text x="260" y="492" text-anchor="middle">user-assigned managed identity</text>
  <text x="260" y="516" text-anchor="middle" fill="#555">no public IP · traffic from the gateway only</text>

  <rect x="520" y="396" width="320" height="134" rx="6" fill="#E6F0FB" stroke="#0078D4" stroke-width="1.5"/>
  <text x="680" y="418" text-anchor="middle" font-size="14" font-weight="700">VM phishing-detector-server-02</text>
  <text x="680" y="438" text-anchor="middle">Standard_B1s · Ubuntu 24.04 LTS · 10.0.2.5</text>
  <text x="680" y="456" text-anchor="middle">systemd service: gunicorn + Flask app :8000</text>
  <text x="680" y="474" text-anchor="middle">cloud-init installs the app at first boot</text>
  <text x="680" y="492" text-anchor="middle">user-assigned managed identity</text>
  <text x="680" y="516" text-anchor="middle" fill="#555">no public IP · traffic from the gateway only</text>

  <!-- PostgreSQL -->
  <rect x="100" y="610" width="320" height="150" rx="6" fill="#EEF0FA" stroke="#336791" stroke-width="1.5"/>
  <text x="260" y="634" text-anchor="middle" font-size="14" font-weight="700">Azure Database for PostgreSQL</text>
  <text x="260" y="654" text-anchor="middle">Flexible Server 16 · B_Standard_B1ms · zone 1</text>
  <text x="260" y="672" text-anchor="middle">phishing-detector-db-&lt;suffix&gt; · 10.0.3.4</text>
  <text x="260" y="690" text-anchor="middle">database phishing_detector · stores the scan history</text>
  <text x="260" y="708" text-anchor="middle">public access disabled · SSL required</text>
  <text x="260" y="740" text-anchor="middle" fill="#555">its name resolves through the private DNS zone</text>

  <!-- Request path -->
  <g stroke="#1B1B1B" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="490" y1="122" x2="490" y2="148"/>
    <line x1="490" y1="196" x2="490" y2="248"/>
    <line x1="320" y1="320" x2="320" y2="394"/>
    <line x1="600" y1="320" x2="600" y2="394"/>
    <line x1="260" y1="530" x2="260" y2="608"/>
    <polyline points="822,530 822,586 380,586 380,608"/>
  </g>
  <text x="498" y="132" font-size="11">HTTP :80</text>
  <text x="608" y="374" font-size="11">HTTP :8000</text>
  <text x="268" y="569" font-size="11">:5432 · SSL</text>

  <!-- Outbound internet through the NAT gateway -->
  <polyline points="868,420 910,420 910,253 936,253" fill="none" stroke="#3B7D23" stroke-width="1.4"
            stroke-dasharray="2 3" marker-end="url(#arrow-green)"/>

  <!-- Calls from the VMs with their managed identity -->
  <g stroke="#6B7785" stroke-width="1.4" fill="none" stroke-dasharray="5 4">
    <line x1="840" y1="470" x2="922" y2="470"/>
    <line x1="922" y1="347" x2="922" y2="470"/>
    <line x1="922" y1="347" x2="936" y2="347" marker-end="url(#arrow-gray)"/>
    <line x1="922" y1="414" x2="936" y2="414" marker-end="url(#arrow-gray)"/>
  </g>

  <!-- Private DNS zone is linked to the VNet -->
  <line x1="900" y1="496" x2="936" y2="496" stroke="#0078D4" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Regional services -->
  <rect x="940" y="222" width="340" height="62" rx="6" fill="#F4F4F4" stroke="#6B7785"/>
  <text x="956" y="243" font-size="13" font-weight="700">NAT gateway nat-gw · Standard, zone 1</text>
  <text x="956" y="260" font-size="11" fill="#555">static public IP nat-pip · attached to subnet-app only</text>
  <text x="956" y="276" font-size="11" fill="#555">outbound for apt + pip at first boot; nothing gets in</text>

  <text x="940" y="314" font-size="13" font-weight="700" fill="#555">Used through the VMs' managed identity</text>

  <rect x="940" y="324" width="340" height="46" rx="6" fill="#F1F8E9" stroke="#6B9E1F"/>
  <text x="956" y="344" font-size="13" font-weight="700">User-assigned identity</text>
  <text x="956" y="361" font-size="11" fill="#555">phishing-detector-vm-identity · attached to both VMs</text>

  <rect x="940" y="382" width="340" height="64" rx="6" fill="#F1F8E9" stroke="#6B9E1F"/>
  <text x="956" y="402" font-size="13" font-weight="700">Storage account · private container app</text>
  <text x="956" y="419" font-size="11" fill="#555">phishing-detector.zip, uploaded by Terraform</text>
  <text x="956" y="436" font-size="11" fill="#555">the identity can only read it (Storage Blob Data Reader)</text>

  <rect x="940" y="462" width="340" height="68" rx="6" fill="#FFFFFF" stroke="#0078D4"/>
  <text x="956" y="482" font-size="13" font-weight="700">Private DNS zone · linked to the VNet</text>
  <text x="956" y="499" font-size="11" fill="#555">phishing-detector.private.postgres.database.azure.com</text>
  <text x="956" y="516" font-size="11" fill="#555">resolves the database name to its private IP</text>

  <rect x="940" y="546" width="340" height="46" rx="6" fill="#F4F4F4" stroke="#6B7785"/>
  <text x="956" y="566" font-size="13" font-weight="700">Run Command (through the VM agent)</text>
  <text x="956" y="583" font-size="11" fill="#555">shell commands without SSH; port 22 is closed</text>

  <!-- Planned, not yet deployed -->
  <rect x="940" y="612" width="340" height="104" rx="6" fill="none" stroke="#9AA3AD" stroke-dasharray="6 4"/>
  <text x="956" y="634" font-size="13" font-weight="700" fill="#6B7785">Planned · not deployed yet</text>
  <text x="956" y="656" fill="#6B7785"><tspan font-weight="600">Key Vault</tspan>: DB connection string</text>
  <text x="970" y="673" font-size="11" fill="#8A929B">(today in /etc/phishing-detector/app.env)</text>
  <text x="956" y="693" fill="#6B7785"><tspan font-weight="600">Azure Monitor</tspan>: logs, workbook, alerts</text>
  <text x="956" y="710" fill="#6B7785"><tspan font-weight="600">Action group</tspan>: alert e-mails</text>

  <!-- Legend -->
  <line x1="60" y1="858" x2="102" y2="858" stroke="#1B1B1B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="110" y="862">User request path</text>
  <line x1="240" y1="858" x2="282" y2="858" stroke="#6B7785" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text x="290" y="862">Calls from both VMs with their managed identity</text>
  <line x1="580" y1="858" x2="622" y2="858" stroke="#3B7D23" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#arrow-green)"/>
  <text x="630" y="862">Outbound internet through the NAT gateway</text>
  <line x1="900" y1="858" x2="942" y2="858" stroke="#0078D4" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="950" y="862">VNet link</text>
  <rect x="1030" y="850" width="34" height="16" rx="3" fill="none" stroke="#9AA3AD" stroke-dasharray="6 4"/>
  <text x="1072" y="862">Not deployed yet</text>
</svg>
